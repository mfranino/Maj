<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#81dcff"><title>Fish Dash</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#92e1fc;font-family:system-ui,sans-serif;touch-action:manipulation}#game{display:block;width:100vw;height:100dvh;touch-action:none}.hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;color:white;font-weight:800;font-size:clamp(15px,2.5vw,24px)}.hud span{padding:9px 14px;border-radius:12px;background:#173e57d9}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#173e572b;padding:15px}#overlay[hidden]{display:none}.panel{max-width:450px;background:#102f42ed;color:white;border-radius:22px;padding:28px;text-align:center;box-shadow:0 18px 40px #1238}h1{font-size:clamp(30px,6vw,50px);margin:0 0 8px}p{line-height:1.4}button{cursor:pointer;border:0;border-radius:100px;padding:14px 24px;font-size:19px;font-weight:800;background:#71f4ad;color:#153948;touch-action:manipulation}#jump{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));right:18px;padding:20px 28px;background:#fff9;backdrop-filter:blur(6px)}#full{background:white;margin-left:6px}
</style></head><body><canvas id="game"></canvas><div class="hud"><span id="score">Score: 0</span><span id="best">Best: 0</span></div><div id="overlay"><div class="panel"><h1>Fish Dash 🐟</h1><p id="msg">Jump over obstacles and collect fish!</p><p>Tap the game, press Space or ↑, or use JUMP.</p><button id="start">START</button><button id="full">⛶</button></div></div><button id="jump">JUMP ↑</button>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),msg=document.getElementById('msg'),startBtn=document.getElementById('start');let W=0,H=0,ground=0,scale=1,run=false,last=0,elapsed=0,speed=0,timer=0,score=0,items=[],particles=[],best=0;try{best=+(localStorage.getItem('fishdash-best')||0)}catch{}bestEl.textContent='Best: '+best;
const photo=new Image();photo.src='character.jpg';photo.onload=()=>{if(!run)draw()};const p={x:0,y:0,w:0,h:0,vy:0};const rand=(a,b)=>a+Math.random()*(b-a);
function resize(){const dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;scale=Math.max(.65,Math.min(1.4,Math.min(W/850,H/500)));canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ground=H*.82;p.w=85*scale;p.h=110*scale;p.x=Math.max(28,W*.12);p.y=Math.min(p.y||ground-p.h,ground-p.h);if(!run)draw()}addEventListener('resize',resize);
function start(){resize();run=true;last=0;elapsed=0;score=0;speed=300*scale;timer=1.1;items=[];particles=[];p.y=ground-p.h;p.vy=0;overlay.hidden=true;requestAnimationFrame(loop)}
function jump(){if(!run){start();return}if(p.y>=ground-p.h-2){p.vy=-Math.sqrt(2*1750*scale*165*scale);for(let i=0;i<8;i++)particles.push({x:p.x+p.w/2,y:ground,vx:rand(-70,70)*scale,vy:rand(-120,0)*scale,t:.4})}}
function end(){run=false;const total=Math.floor(score);msg.textContent='Game over! Score: '+total;startBtn.textContent='PLAY AGAIN';overlay.hidden=false;if(total>best){best=total;bestEl.textContent='Best: '+best;try{localStorage.setItem('fishdash-best',best)}catch{}}}
function spawn(){const fish=Math.random()<.3;const h=(fish?26:rand(43,67))*scale,w=(fish?40:46)*scale;items.push({x:W+40*scale,y:fish?ground-rand(125,170)*scale:ground-h,w,h,fish,hit:false})}
function update(dt){elapsed+=dt;speed=Math.min(690*scale,(300+elapsed*14)*scale);timer-=dt;if(timer<=0){spawn();timer=rand(.86,1.4)*300*scale/speed}p.vy+=1750*scale*dt;p.y+=p.vy*dt;if(p.y>ground-p.h){p.y=ground-p.h;p.vy=0}
for(const o of items){o.x-=speed*dt;if(o.hit)continue;const ax=p.x+p.w*.15,ay=p.y+p.h*.12,aw=p.w*.7,ah=p.h*.8;if(ax<o.x+o.w*.88&&ax+aw>o.x+o.w*.12&&ay<o.y+o.h*.9&&ay+ah>o.y+o.h*.1){o.hit=true;if(o.fish){score+=50;for(let i=0;i<9;i++)particles.push({x:o.x+o.w/2,y:o.y,vx:rand(-100,100)*scale,vy:rand(-140,0)*scale,t:.5})}else{end();return}}}items=items.filter(o=>o.x+o.w>0&&!o.hit);for(const q of particles){q.t-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=300*scale*dt}particles=particles.filter(q=>q.t>0);score+=dt*12;scoreEl.textContent='Score: '+Math.floor(score)}
function cloud(x,y,z){ctx.fillStyle='#ffffffc9';for(const [a,b,r] of [[0,0,23],[24,-14,29],[50,0,23]]){ctx.beginPath();ctx.arc(x+a*z,y+b*z,r*z,0,7);ctx.fill()}}
function draw(){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#7dd8fc');sky.addColorStop(1,'#e4faff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffe9a2';ctx.beginPath();ctx.arc(W*.85,H*.17,37*scale,0,7);ctx.fill();cloud(W-((elapsed*22*scale)%(W+160)),H*.18,scale);cloud(W*.46-((elapsed*13*scale)%(W+200)),H*.27,scale*.75);ctx.fillStyle='#9bdeb3';ctx.beginPath();ctx.moveTo(0,ground);for(let x=0;x<=W+25;x+=20)ctx.lineTo(x,ground-38*scale-Math.sin(x*.012+elapsed*.08)*17*scale);ctx.lineTo(W,ground);ctx.fill();ctx.fillStyle='#d7ae76';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#5bc078';ctx.fillRect(0,ground-5*scale,W,11*scale);ctx.fillStyle='#a8875c';for(let i=0;i<Math.ceil(W/80)+2;i++){const x=((i*86-elapsed*speed*.5)%(W+100)+(W+100))%(W+100);ctx.fillRect(x,ground+27*scale+(i%2)*19*scale,30*scale,4*scale)}
for(const o of items){if(o.fish){ctx.fillStyle='#ffb34a';ctx.beginPath();ctx.ellipse(o.x+o.w*.45,o.y+o.h*.5,o.w*.37,o.h*.42,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(o.x+o.w*.7,o.y+o.h*.5);ctx.lineTo(o.x+o.w,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.arc(o.x+o.w*.26,o.y+o.h*.4,4*scale,0,7);ctx.fill();ctx.fillStyle='#173e57';ctx.beginPath();ctx.arc(o.x+o.w*.26,o.y+o.h*.4,2*scale,0,7);ctx.fill()}else{ctx.fillStyle='#667985';ctx.beginPath();ctx.moveTo(o.x,o.y+o.h);ctx.lineTo(o.x+o.w*.1,o.y+o.h*.3);ctx.lineTo(o.x+o.w*.45,o.y);ctx.lineTo(o.x+o.w*.85,o.y+o.h*.22);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.fill();ctx.fillStyle='#9baab1';ctx.beginPath();ctx.moveTo(o.x+o.w*.45,o.y+5*scale);ctx.lineTo(o.x+o.w*.2,o.y+o.h*.7);ctx.lineTo(o.x+o.w*.53,o.y+o.h*.56);ctx.fill()}}
ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(p.x+p.w*.5,ground+6*scale,p.w*.38,5*scale,0,0,7);ctx.fill();ctx.save();ctx.translate(p.x+p.w/2,p.y+p.h/2);ctx.rotate(Math.max(-.2,Math.min(.3,p.vy/(2400*scale))));ctx.beginPath();ctx.roundRect(-p.w/2,-p.h/2,p.w,p.h,13*scale);ctx.clip();if(photo.complete&&photo.naturalWidth){const r=Math.max(p.w/photo.naturalWidth,p.h/photo.naturalHeight),dw=photo.naturalWidth*r,dh=photo.naturalHeight*r;ctx.drawImage(photo,-dw/2,-dh/2,dw,dh)}else{ctx.fillStyle='#f8bad1';ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h)}ctx.restore();ctx.strokeStyle='white';ctx.lineWidth=3*scale;ctx.beginPath();ctx.roundRect(p.x,p.y,p.w,p.h,13*scale);ctx.stroke();for(const q of particles){ctx.globalAlpha=Math.max(0,q.t/.5);ctx.fillStyle='#fff0a5';ctx.beginPath();ctx.arc(q.x,q.y,4*scale,0,7);ctx.fill()}ctx.globalAlpha=1}
function loop(t){if(!run)return;if(!last)last=t;const dt=Math.min(.035,(t-last)/1000);last=t;update(dt);draw();if(run)requestAnimationFrame(loop)}
startBtn.onclick=start;document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.().catch(()=>{});document.getElementById('jump').onclick=jump;canvas.onpointerdown=jump;addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)jump()}if(e.code==='KeyR')start()});resize();
})();
</script></body></html>
