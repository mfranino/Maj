<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#dff8ff"><title>Fish Dash</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:linear-gradient(150deg,#ddfaff,#fff0e1);font-family:system-ui,sans-serif;color:#153e55;padding:16px}.wrap{width:min(850px,100%)}h1{margin:0 0 6px}p{margin:0 0 12px}.frame{position:relative;border:4px solid #21516b;border-radius:18px;overflow:hidden;background:#bdeeff;box-shadow:0 12px 28px #17485f30}canvas{display:block;width:100%;height:auto;touch-action:manipulation}.hud{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;font-weight:800;font-size:18px;pointer-events:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#ffffffe0;text-align:center}.overlay[hidden]{display:none}.panel{padding:20px;background:white;border:3px solid #21516b;border-radius:18px;max-width:86%}button{border:0;border-radius:14px;background:#f76783;padding:15px 29px;font-weight:800;font-size:20px;color:white;cursor:pointer;touch-action:manipulation}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0}.controls small{color:#547080}button:active{transform:scale(.96)}</style>
</head><body><main class="wrap"><h1>🐟 Fish Dash!</h1><p>Jump over obstacles, catch fish, and beat your record.</p><div class="frame"><canvas id="game" width="800" height="390" aria-label="Fish Dash jumping game"></canvas><div class="hud"><span id="score">Score: 0</span><span id="best">Best: 0</span></div><div class="overlay" id="overlay"><div class="panel"><h2 id="message">Ready to dash?</h2><p>Tap, press Space, or ↑ to jump!</p><button id="start">START GAME</button></div></div></div><div class="controls"><small>Mobile: tap anywhere on the game • Desktop: Space / ↑ • R to restart</small><button id="jump">JUMP ↑</button></div></main>
<script>
(()=>{'use strict';const c=document.querySelector('#game'),ctx=c.getContext('2d'),overlay=document.querySelector('#overlay'),msg=document.querySelector('#message'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best');const W=800,H=390,ground=329;let best=0;try{best=+(localStorage.getItem('fishdash-best')||0)}catch{}bestEl.textContent='Best: '+best;let running=false,dead=false,last=0,elapsed=0,score=0,speed=290,spawn=0,objects=[],particles=[],player={x:100,y:ground-94,w:76,h:94,vy:0};const rand=(a,b)=>a+Math.random()*(b-a);
function reset(){running=true;dead=false;last=0;elapsed=0;score=0;speed=290;spawn=.9;objects=[];particles=[];player.y=ground-player.h;player.vy=0;overlay.hidden=true;requestAnimationFrame(loop)}
function jump(){if(!running){reset();return}if(player.y>=ground-player.h-1){player.vy=-700;for(let i=0;i<7;i++)particles.push({x:player.x+25,y:ground,vx:rand(-80,40),vy:rand(-80,-10),life:.35})}}
function end(){running=false;dead=true;msg.textContent='Game over! Score: '+Math.floor(score);document.querySelector('#start').textContent='PLAY AGAIN';overlay.hidden=false;const n=Math.floor(score);if(n>best){best=n;bestEl.textContent='Best: '+best;try{localStorage.setItem('fishdash-best',best)}catch{}}}
function spawnObject(){const fish=Math.random()<.29;objects.push({x:W+25,y:fish?rand(ground-163,ground-115):ground-(Math.random()<.5?41:62),w:fish?40:45,h:fish?26:62,fish,hit:false})}
function update(dt){elapsed+=dt;speed=Math.min(580,290+elapsed*9);spawn-=dt;if(spawn<=0){spawnObject();spawn=rand(.85,1.48)*290/speed}player.vy+=1800*dt;player.y+=player.vy*dt;if(player.y>ground-player.h){player.y=ground-player.h;player.vy=0}for(const o of objects){o.x-=speed*dt;const ax=player.x+17,ay=player.y+16,aw=player.w-32,ah=player.h-19;if(ax<o.x+o.w-7&&ax+aw>o.x+7&&ay<o.y+o.h-5&&ay+ah>o.y+5&&!o.hit){if(o.fish){o.hit=true;score+=50;for(let j=0;j<9;j++)particles.push({x:o.x+20,y:o.y+14,vx:rand(-100,100),vy:rand(-180,20),life:.5})}else{end();break}}}objects=objects.filter(o=>o.x+o.w>-20&&!o.hit);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);score+=dt*12;scoreEl.textContent='Score: '+Math.floor(score)}
function cloud(x,y,s){ctx.fillStyle='#ffffffbb';for(const [dx,dy,r] of [[0,0,22],[24,-13,29],[50,2,21]]){ctx.beginPath();ctx.arc(x+dx*s,y+dy*s,r*s,0,7);ctx.fill()}}
function person(){ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle='#faafc9';ctx.fillRect(20,66,13,22);ctx.fillRect(53,66,13,22);ctx.fillStyle='#202126';ctx.beginPath();ctx.ellipse(24,89,21,10,0,0,7);ctx.ellipse(60,89,21,10,0,0,7);ctx.fill();ctx.fillStyle='#ef4556';ctx.strokeStyle='#bf253f';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(13,24);ctx.lineTo(64,24);ctx.lineTo(78,72);ctx.lineTo(0,72);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle='#ffaac7';ctx.lineWidth=11;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(12,35);ctx.lineTo(-2,52);ctx.moveTo(67,35);ctx.lineTo(83,51);ctx.stroke();ctx.fillStyle='#ff9fbd';ctx.beginPath();ctx.ellipse(40,17,34,25,0,0,7);ctx.fill();ctx.fillStyle='#ffbfd3';ctx.beginPath();ctx.ellipse(62,15,17,13,0,0,7);ctx.fill();ctx.fillStyle='#ed729d';ctx.beginPath();ctx.arc(59,14,3,0,7);ctx.arc(67,14,3,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(28,12,8,0,7);ctx.arc(45,9,8,0,7);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(30,12,3,0,7);ctx.arc(47,9,3,0,7);ctx.fill();ctx.strokeStyle='#a72f61';ctx.lineWidth=3;ctx.beginPath();ctx.arc(40,27,11,.18,2.8);ctx.stroke();ctx.restore()}
function draw(t){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#97dcff');sky.addColorStop(1,'#e8fcff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);cloud(W-(elapsed*19%930),74,1);cloud(420-(elapsed*11%900),123,.7);ctx.fillStyle='#91d8ab';ctx.beginPath();ctx.moveTo(0,ground);for(let x=0;x<=W;x+=20)ctx.lineTo(x,ground-20-Math.sin(x*.013)*13);ctx.lineTo(W,ground);ctx.fill();ctx.fillStyle='#e3b57d';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#b48858';for(let i=0;i<20;i++){const x=((i*59-elapsed*speed*.35)%850+850)%850;ctx.fillRect(x,ground+20+(i%3)*12,22,4)}ctx.fillStyle='#4c914b';ctx.fillRect(0,ground-3,W,6);person();for(const o of objects){if(o.fish){ctx.fillStyle='#38a8dc';ctx.beginPath();ctx.ellipse(o.x+18,o.y+13,20,12,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(o.x+31,o.y+13);ctx.lineTo(o.x+42,o.y+2);ctx.lineTo(o.x+42,o.y+24);ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.arc(o.x+9,o.y+10,4,0,7);ctx.fill();ctx.fillStyle='#172c46';ctx.beginPath();ctx.arc(o.x+8,o.y+10,2,0,7);ctx.fill()}else{ctx.fillStyle='#697c86';ctx.beginPath();ctx.moveTo(o.x,o.y+o.h);ctx.lineTo(o.x+6,o.y+13);ctx.lineTo(o.x+20,o.y);ctx.lineTo(o.x+37,o.y+15);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.fill();ctx.fillStyle='#94a8b0';ctx.beginPath();ctx.moveTo(o.x+20,o.y+5);ctx.lineTo(o.x+12,o.y+o.h-5);ctx.lineTo(o.x+22,o.y+o.h-7);ctx.fill()}}for(const p of particles){ctx.fillStyle='#fff1a7';ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill()}if(!running&&!dead){ctx.fillStyle='#ffffff33';ctx.fillRect(0,0,W,H)}}
function loop(ts){if(!running)return;if(!last)last=ts;const dt=Math.min((ts-last)/1000,.035);last=ts;update(dt);draw(ts);if(running)requestAnimationFrame(loop)}document.querySelector('#start').addEventListener('click',reset);document.querySelector('#jump').addEventListener('click',jump);c.addEventListener('pointerdown',jump);document.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)jump()}if(e.code==='KeyR')reset()});draw(0);
})();
</script></body></html>
